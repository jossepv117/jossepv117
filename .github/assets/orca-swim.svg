<svg viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg" width="220" height="80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .body { fill: #1b1b1f; }
      .white { fill: #ffffff; }
      .eye { fill: #ffffff; }
      .pupil { fill: #1b1b1f; }
    </style>
  </defs>

  <!-- water line -->
  <rect x="0" y="60" width="220" height="1" fill="#7fb3d5" opacity="0.4"/>

  <!-- bubbles rising -->
  <g fill="#a9cce3" opacity="0.7">
    <circle cx="40" cy="70" r="1.5">
      <animate attributeName="cy" from="70" to="10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="72" r="1" >
      <animate attributeName="cy" from="72" to="15" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="68" r="1.2">
      <animate attributeName="cy" from="68" to="8" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orca swimming across, bobbing up and down -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="220,0; -80,0" dur="6s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-3; 0,0; 0,3; 0,0" dur="1.6s" repeatCount="indefinite"/>

      <!-- tail fin, wagging -->
      <g transform="translate(78,32)">
        <path d="M0,0 L14,-8 L14,8 Z" class="body">
          <animateTransform attributeName="transform" type="rotate"
            values="-18 0 0; 18 0 0; -18 0 0" dur="0.5s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- body -->
      <path d="M10,28
               Q0,20 10,12
               Q35,-2 60,10
               Q75,16 78,26
               Q75,34 60,38
               Q35,46 10,36
               Q6,32 10,28 Z" class="body"/>

      <!-- white belly patch -->
      <path d="M18,28
               Q25,34 42,34
               Q30,22 20,20
               Q14,24 18,28 Z" class="white"/>

      <!-- white eye patch -->
      <ellipse cx="22" cy="16" rx="6" ry="3" class="white" transform="rotate(-20 22 16)"/>

      <!-- dorsal fin -->
      <path d="M42,10 Q46,-6 54,8 Q48,10 42,10 Z" class="body"/>

      <!-- pectoral fin -->
      <path d="M32,26 Q22,34 14,32 Q22,26 32,26 Z" class="body">
        <animateTransform attributeName="transform" type="rotate"
          values="0 24 28; -12 24 28; 0 24 28" dur="1.4s" repeatCount="indefinite"/>
      </path>

      <!-- eye -->
      <circle cx="20" cy="18" r="1.6" class="pupil"/>
    </g>
  </g>
</svg>
